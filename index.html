<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fingerboard">
<meta name="theme-color" content="#1d1b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Fingerboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1e1c51;--navy2:#17163f;--green:#24b866;--green2:#1fa457;--purple:#a14fb8;--purple2:#c17ed8;--blue:#0a74ff;--hold:#4dff6a;--ink:#0d0b33;--muted:#9c9ca8;--line:#ececf0;--soft:#f3f3f6;--go:#2ee87a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:'IBM Plex Sans',-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.page{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.head{display:flex;align-items:center;justify-content:center;position:relative;min-height:46px}
.head h1{font-size:22px;font-weight:700;margin:0;text-align:center}
.head .l,.head .r{position:absolute;top:50%;transform:translateY(-50%)}
.head .l{left:0}.head .r{right:0}
.pill{background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-weight:600;font-size:15px}
.link{color:var(--blue);font-size:16px;font-weight:600;padding:8px 0}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:10px -16px 0}
.tabs button{flex:1;padding:14px 0 12px;font-size:18px;color:#a6a6b0;border-bottom:4px solid transparent}
.tabs button.on{color:var(--ink);border-color:#3ef06a}
.card{margin-top:26px}
.card-top{display:flex;align-items:center;gap:10px;margin:0 8px 10px}
.avatar{width:34px;height:34px;border-radius:50%;background:#a8660b;color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px;flex:none}
.card-top .who{flex:1;font-size:16px}
.dots{font-size:26px;line-height:1;letter-spacing:1px;padding:0 6px;font-weight:700}
.media{background:var(--navy);border-radius:6px;padding:22px 26px 16px;cursor:pointer;display:block;width:100%;text-align:left}
.chip{display:inline-flex;align-items:center;gap:6px;background:#dcdce6;color:var(--ink);border-radius:6px;padding:5px 12px;font-size:14px;margin-top:10px}
.info{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 8px 0;gap:12px}
.info h3{margin:0 0 8px;font-size:19px;font-weight:700;cursor:pointer}
.level{display:inline-block;background:#e9fbea;color:#36cf57;padding:4px 12px;border-radius:4px;font-size:16px}
.level.mittel{background:#fff6d1;color:#d6a300}
.level.fortgeschritten{background:#ffe9e6;color:#e5482f}
.dur{background:var(--soft);border-radius:6px;padding:6px 12px;font-size:16px;white-space:nowrap}
.dur b{font-weight:700}
.empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.5}
.fab{position:fixed;right:max(20px,calc(50vw - 340px));bottom:calc(env(safe-area-inset-bottom) + 86px);width:60px;height:60px;border-radius:50%;background:var(--go);color:#fff;font-size:38px;font-weight:400;box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;z-index:4;line-height:1}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;max-width:160px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#a6a6b0}
.nav button.on{color:var(--ink);font-weight:700}
.nav svg{width:28px;height:28px}
.board{display:block;width:100%;height:auto}
.board .h.pick{cursor:pointer}
/* forms */
.sec{margin-top:26px}
.sec h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.field>label{flex:1}
.txt{width:100%;border:1px solid #dcdce4;border-radius:10px;padding:12px 14px;font-size:17px;background:#fff}
.sel{border:1px solid #dcdce4;border-radius:10px;padding:9px 12px;font-size:16px;background:#fff;max-width:60%}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:38px;height:38px;border-radius:8px;background:var(--ink);color:#fff;font-size:22px;line-height:1}
.stp input{width:62px;text-align:center;border:1px solid #dcdce4;border-radius:8px;padding:7px 4px;font-size:17px;font-weight:600}
.stp span{width:20px;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:15px;color:#555}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.boardbox{background:var(--navy);border-radius:10px;padding:18px 16px 14px;margin-top:10px}
.boardbox .hint{color:#c9c8e8;font-size:14px;text-align:center;margin-top:10px;line-height:1.4}
.boardbox .seg{margin-bottom:14px;background:rgba(255,255,255,.12)}
.boardbox .seg button{color:#d6d5f2}
.boardbox .seg button.on{background:#fff;color:var(--ink)}
.exrow{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.exrow .mini{width:96px;flex:none;background:var(--navy);border-radius:6px;padding:8px}
.exrow .tx{flex:1;min-width:0}
.exrow b{display:block;font-size:16px}
.exrow small{color:#6c6c7a;font-size:13.5px;line-height:1.35;display:block}
.exrow .acts{display:flex;flex-direction:column;gap:2px}
.ib{width:34px;height:30px;border-radius:6px;background:var(--soft);font-size:15px;color:#444}
.addrow{display:flex;gap:10px;margin-top:6px}
.btn{display:block;width:100%;text-align:center;background:var(--blue);color:#fff;border-radius:10px;padding:15px;font-size:18px;font-weight:700}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:#fff0f0;color:#d22}
.toggle{width:52px;height:31px;border-radius:999px;background:#d8d8e0;position:relative;transition:.2s;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle.on{background:var(--go)}
.toggle.on::after{left:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:var(--soft);border-radius:12px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:#6c6c7a}
.hist{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;cursor:pointer}
.hist .t{display:flex;justify-content:space-between;gap:10px}
.hist .t b{font-size:16px}
.hist .t span,.hist small{color:#6c6c7a;font-size:14px}
.hist .det{margin-top:10px;font-size:14px;line-height:1.55;border-top:1px solid var(--line);padding-top:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,8,40,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h4{margin:8px 0 6px;text-align:center;font-size:15px;color:var(--muted);font-weight:600}
.sheet button{display:block;width:100%;padding:15px;font-size:17px;border-bottom:1px solid var(--line)}
.sheet button.red{color:#d22}
.sheet button:last-child{border:0;font-weight:600}
.note{font-size:14px;color:#6c6c7a;line-height:1.45;margin-top:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.cal-h b{font-size:18px}
.cal-h button{width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cd{aspect-ratio:1/1.12;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;font-size:15px;position:relative}
.cd.out{opacity:.3}
.cd.plan{background:var(--soft);cursor:pointer}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.sel{background:var(--navy);color:#fff}
.cd.done{background:#e3fbe8}
.cd.done.sel{background:var(--green2)}
.cd .cdots{display:flex;gap:3px}
.cd .cdots i{width:9px;height:9px;border-radius:50%}
.cd .ok{position:absolute;bottom:3px;font-size:11px;color:#22a457;font-weight:700}
.cd.sel .ok{color:#fff}
.cd .ok.free{color:#9c9ca8}
.lv-X{background:#b4b4c0}
.cd.miss .num{color:#d22}
.lv-E{background:#36cf57}.lv-M{background:#e8b400}.lv-H{background:#e5482f}
.cal-leg{display:flex;gap:14px;justify-content:center;font-size:13px;color:#6c6c7a;margin-top:10px;flex-wrap:wrap}
.cal-leg span{display:inline-flex;align-items:center;gap:5px}
.cal-leg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.plan-card{background:var(--navy);color:#fff;border-radius:14px;padding:16px;margin-top:16px}
.plan-card .pc-d{font-size:14px;color:#c9c8e8}
.plan-card h3{margin:4px 0 10px;font-size:20px}
.plan-card .pc-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.plan-card .pc-list span{border-radius:6px;padding:4px 10px;font-size:14px;font-weight:600;color:#14123a}
.plan-card .btn{margin-top:4px}
.prog{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--go)}
.banner{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;margin-top:14px}
.banner div{flex:1;font-size:14px;color:#c9c8e8;line-height:1.35}
.banner b{display:block;color:#fff;font-size:16px}
.banner button{background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;font-size:15px}

/* ---------- Player ---------- */
#player:empty{display:none}
.player{position:fixed;inset:0;z-index:20;color:#fff;overflow:hidden;background:linear-gradient(100deg,var(--navy),var(--navy2));user-select:none;-webkit-user-select:none}
.player.rest{background:linear-gradient(100deg,var(--purple),var(--purple2))}
.fill{position:absolute;left:0;top:0;bottom:0;width:0}
.player.work .fill{background:linear-gradient(100deg,var(--green),var(--green2))}
.player.rest .fill{background:linear-gradient(100deg,var(--navy),var(--navy2))}
.p-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
.p-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:48px}
.p-x{justify-self:start;width:44px;height:44px;display:grid;place-items:center}
.p-x svg{width:24px;height:24px}
.p-title{font-weight:700;font-size:clamp(20px,5.6vmin,46px);text-align:center;line-height:1.15}
.p-ctrl{justify-self:end;display:flex;gap:clamp(10px,3.4vmin,40px);align-items:center}
.p-ctrl button{width:clamp(30px,6vmin,52px);height:clamp(30px,6vmin,52px);display:grid;place-items:center}
.p-ctrl button[disabled]{opacity:.35}
.p-ctrl svg{width:100%;height:100%}
.p-sub{text-align:center;font-weight:600;font-size:clamp(16px,4.2vmin,36px);margin-top:clamp(2px,1.6vmin,16px)}
.p-sub.g{color:#3ef07a}
.p-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,28px);min-height:0}
.p-board{width:min(54vw,128vmin)}
.grip{width:clamp(104px,17vw,172px);background:rgba(255,255,255,.26);border-radius:clamp(12px,2.2vmin,22px);padding:clamp(10px,2vmin,18px) 10px;text-align:center;font-size:clamp(12px,2.8vmin,20px);line-height:1.25}
.grip svg{width:clamp(44px,9vmin,80px);height:auto;display:block;margin:0 auto 6px}
.grip .gn{font-weight:600}
.p-bot{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}
.p-set{font-size:clamp(18px,4.6vmin,40px);justify-self:start}
.p-set span{color:#8e8db5}
.p-btn{background:var(--blue);color:#fff;border-radius:clamp(8px,1.6vmin,14px);font-weight:700;font-size:clamp(17px,4.3vmin,38px);padding:clamp(10px,2.6vmin,24px) clamp(24px,6vmin,80px);min-width:clamp(200px,24vw,480px)}
.p-right{justify-self:end;text-align:center}
.p-time{font-weight:700;font-size:clamp(34px,9.5vmin,90px);line-height:1;font-variant-numeric:tabular-nums}
.ht b{display:block;font-size:clamp(20px,4.8vmin,40px);font-variant-numeric:tabular-nums}
.ht span{font-size:clamp(13px,3.2vmin,28px);color:#cfcde8}
.big{font-weight:700;font-size:clamp(90px,34vmin,300px);line-height:1;color:#dcdce4;font-variant-numeric:tabular-nums}
.rt{text-align:center}
.rt .p-time{font-size:clamp(64px,15vmin,140px)}
.rt .lb{font-size:clamp(22px,6vmin,56px);margin-top:4px}
.rt .plus{margin-top:clamp(6px,2vmin,16px);background:rgba(255,255,255,.2);border-radius:999px;padding:6px 16px;font-size:clamp(14px,3vmin,22px);font-weight:600}
.wt{text-align:center;font-size:clamp(16px,4vmin,32px)}
.wt .row{display:flex;align-items:center;justify-content:center;gap:clamp(24px,7vmin,70px);margin:clamp(6px,1.6vmin,14px) 0}
.wt .row button{width:clamp(52px,10vmin,96px);height:clamp(52px,10vmin,96px);background:#05042a;border-radius:6px;display:grid;place-items:center}
.wt .row button svg{width:45%;height:45%}
.wt .val{min-width:3.6em;font-size:clamp(28px,6.5vmin,60px)}
.wt .val b{font-size:1.2em}
.wt small{font-size:.75em}
.done-s{display:flex;gap:clamp(12px,3vw,40px);text-align:center}
.done-s div{background:rgba(255,255,255,.1);border-radius:14px;padding:clamp(12px,3vmin,26px) clamp(16px,3vw,36px)}
.done-s b{display:block;font-size:clamp(26px,7vmin,60px)}
.done-s span{color:#cfcde8;font-size:clamp(13px,3vmin,22px)}
.dlg-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:3}
.dlg{background:#fff;color:var(--ink);border-radius:22px;padding:clamp(18px,4vmin,40px) clamp(18px,4vmin,40px);width:min(700px,100%)}
.dlg h3{margin:0 0 10px;font-size:clamp(19px,4.2vmin,30px)}
.dlg p{margin:0;font-size:clamp(15px,3.4vmin,24px);line-height:1.35}
.dlg .v{text-align:center;font-weight:700;font-size:clamp(20px,4.4vmin,30px);margin-top:14px}
.dlg input[type=range]{width:100%;margin:6px 0 20px;accent-color:#2c8bff;height:30px}
.dlg .ok{display:block;width:100%;background:#2ce77a;color:#fff;border-radius:14px;padding:clamp(12px,3vmin,22px);font-weight:700;font-size:clamp(17px,4vmin,28px)}
.p-board.mb{width:min(44vw,104vmin)}
.tasks{display:flex;flex-direction:column;gap:clamp(6px,1.6vmin,14px)}
.task{display:flex;align-items:center;gap:clamp(8px,1.6vmin,14px);font-weight:600;font-size:clamp(16px,4.6vmin,36px);background:rgba(0,0,0,.2);border-radius:12px;padding:clamp(6px,1.6vmin,14px) clamp(10px,2.2vmin,20px)}
.task i,.task-ed i{width:clamp(10px,1.8vmin,14px);height:clamp(22px,5vmin,40px);border-radius:4px;flex:none}
.p-next{font-size:clamp(14px,3.4vmin,26px);color:#e6e5f5;background:rgba(0,0,0,.22);border-radius:10px;padding:clamp(8px,2vmin,14px) 16px;max-width:46vw;text-align:center}
.tot{font-size:clamp(13px,3.4vmin,26px);color:#e6e5f5;margin-top:4px;font-variant-numeric:tabular-nums}
.task-ed{display:flex;gap:8px;align-items:center;margin-top:10px}
.task-ed .sel{max-width:none;flex:1;min-width:0;padding:9px 6px;font-size:15px}
.tn{width:54px;text-align:center;border:1px solid #dcdce4;border-radius:8px;padding:8px 4px;font-size:16px;font-weight:600}
.rot{display:none}
@media (orientation:portrait){
  .p-mid{flex-wrap:wrap;align-content:center}
  .p-board,.p-board.mb{width:94vw;order:-1}
  .p-next{max-width:none}
  .grip{width:40vw}
  .p-top{grid-template-columns:auto 1fr auto}
  .p-title{font-size:clamp(18px,5.4vw,30px)}
  .p-ctrl{gap:14px}
  .p-ctrl button{width:28px;height:28px}
  .p-bot{grid-template-columns:1fr 1fr;row-gap:16px}
  .p-bot>div:nth-child(2){grid-column:1/-1;order:3}
  .p-btn{width:100%;min-width:0}
  .rot{display:block;text-align:center;color:#a9a8cf;font-size:13px;margin-top:6px}
  .done-s{flex-direction:column}
}
</style>
</head>

<script>
'use strict';
// ---------- Helpers & Storage ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const store = {
  get(k, d) { try { const v = localStorage.getItem('fw.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fw.' + k, JSON.stringify(v)); } catch {} }
};
const mmss = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const human = s => { s = Math.round(s); return s < 60 ? s + ' s' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' min'; };

// ---------- Beastmaker 1000 ----------
// Koordinaten im Board-SVG (viewBox 1060 x 304)
const HOLDS = {

  A4:{x:545,y:62,w:121,h:44,n:'Tiefes Loch Mitte rechts'},
  A5:{x:681,y:0,w:165,h:74,n:'Runder Sloper rechts',sl:1},
  A6:{x:848,y:62,w:166,h:44,n:'Kleine Leiste rechts'},
  B1:{x:16,y:138,w:167,h:44,n:'Große Leiste links'},
  B2:{x:197,y:138,w:91,h:44,n:'2-Finger-Loch links'},
  B3:{x:303,y:138,w:120,h:44,n:'3-Finger-Loch links'},
  B4:{x:439,y:138,w:166,h:44,n:'Mittelleiste'},
  B5:{x:620,y:138,w:121,h:44,n:'3-Finger-Loch rechts'},

let svgN = 0;
function boardSVG(L, R, pick, marks) {
  const id = 'bc' + (++svgN);
  let s = `<svg class="board" viewBox="-2 -2 1064 308" xmlns="http://www.w3.org/2000/svg">
<defs><clipPath id="${id}"><rect x="0" y="0" width="1060" height="304" rx="150" ry="150"/></clipPath></defs>
<rect x="0" y="0" width="1060" height="304" rx="150" ry="150" fill="#8b5d39"/>
<g clip-path="url(#${id})"><rect x="-10" y="-40" width="1080" height="252" rx="130" ry="96" fill="#aa7d51"/></g>`;
  for (const [k, h] of Object.entries(HOLDS)) {
    const on = k === L || k === R;
    const base = h.jug ? '#a2754a' : h.sl ? '#c69c6d' : (k[0] === 'C' ? '#5f3a17' : '#7a4a28');
    const rx = h.sl ? 10 : 22;
    s += `<rect${h.jug ? ` clip-path="url(#${id})"` : ''} class="h${pick ? ' pick' : ''}" data-hold="${k}" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" rx="${rx}" fill="${marks ? (marks[k] || base) : (on ? 'var(--hold)' : base)}"/>`;
    if (pick && on) {
      const t = L === R ? 'L+R' : (k === L ? 'L' : 'R');
      s += `<text x="${h.x + h.w / 2}" y="${h.y + h.h / 2 + 11}" text-anchor="middle" font-size="32" font-weight="700" fill="#14123a" pointer-events="none">${t}</text>`;
    }
  }
  return s + '</svg>';
}
const holdName = k => k ? HOLDS[k].n : '–';
function holdsText(e) {

  if (!e.L || !e.R) return (e.L ? 'Links: ' + holdName(e.L) : 'Rechts: ' + holdName(e.R)) + ' (einarmig)';

}

  });

// ----- Challenge-Kalender -----
// Plan laut program.pdf: Training an Tag 2, 4 und 7 jeder Woche; E/M/H = Easy/Medium/Hard
const PLAN = [
  [['E'], ['E'], ['E']],
  [['M'], ['E', 'M'], ['M']],
  [['E', 'M'], ['M', 'M'], ['M']],
  [['M', 'M'], ['H'], ['M']],
  [['E', 'M'], ['E', 'H'], ['H']],
  [['M'], ['E', 'M'], ['M']],
  [['E'], ['M'], ['E']]];
const PLAN_DAYS = [2, 4, 7];
const PID = {E:'tpl-easy', M:'tpl-medium', H:'tpl-hard'};
const LV = {E:'Easy', M:'Medium', H:'Hard'};
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const pday = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmtDay = k => pday(k).toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
const planOn = k => S.challenge && S.challenge.sessions.find(x => x.date === k);
const planDone = k => HIST.some(h => h.plan === k && !h.partial);
// Trainings außerhalb des Plans an einem Tag (nach Datum der Durchführung)
const LVK = {'Anfänger':'E', 'Mittel':'M', 'Fortgeschritten':'H'};
const freeOn = k => HIST.filter(h => !h.plan && ymd(new Date(h.date)) === k);
const freeLv = h => { const w = findW(h.wid); return LVK[h.level || (w && w.level)] || 'X'; };
function makePlan(start) {
  const d0 = pday(start);
  return PLAN.flatMap((wk, wi) => wk.map((lv, di) => ({date:ymd(addDays(d0, wi * 7 + PLAN_DAYS[di] - 1)), lv, week:wi + 1})));
}
// Mehrere Einheiten eines Tages werden zu einem durchgehenden Training verbunden
function planWorkout(p) {
  const ws = p.lv.map(k => findW(PID[k]));
  if (ws.length === 1) return Object.assign(clone(ws[0]), {id:'plan-' + p.date});
  let n = 0;
  return {id:'plan-' + p.date, name:p.lv.map(k => LV[k]).join(' + ') + ' Workout', level:ws[ws.length - 1].level, cat:'Kraft',
    ex:ws.flatMap(w => clone(w.ex)).map(e => Object.assign(e, {id:uid(), name:e.type === 'minute' ? 'Minute ' + (++n) : e.name}))};
}
const planLabel = p => p.lv.map(k => LV[k]).join(' + ');
const planMin = p => Math.round(wSecs(planWorkout(p)) / 60);
// Kalenderdatei mit allen Challenge-Terminen um 18 Uhr; die Erinnerung kommt vom Handy-Kalender
function challengeICS() {
  const t = new Date(), stamp = `${ymd(t).replace(/-/g, '')}T${String(t.getHours()).padStart(2, '0')}${String(t.getMinutes()).padStart(2, '0')}00`;
  const ev = S.challenge.sessions.map(p => {
    const d = p.date.replace(/-/g, ''), end = 18 * 60 + planMin(p);
    return ['BEGIN:VEVENT', `UID:fingerboard-${S.challenge.start}-${p.date}`, `DTSTAMP:${stamp}`,
      `DTSTART:${d}T180000`, `DTEND:${d}T${String(Math.floor(end / 60)).padStart(2, '0')}${String(end % 60).padStart(2, '0')}00`,
      `SUMMARY:Fingerboard: ${planLabel(p)}`, `DESCRIPTION:Challenge Woche ${p.week} · ${planMin(p)} Min am Stück`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:Zeit fürs Fingerboard: ${planLabel(p)}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT'].join('\r\n');
  });
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Fingerboard//Challenge//DE', 'CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n') + '\r\n';
}
function todayBanner() {
  const p = planOn(ymd(new Date()));
  if (!p || planDone(p.date)) return '';
  return `<div class="banner"><div><b>Heute im Plan: ${planLabel(p)}</b>Woche ${p.week} · ${planMin(p)} Min am Stück</div><button data-a="planstart" data-d="${p.date}">Starten</button></div>`;
}
function calView() {
  const c = S.challenge, today = ymd(new Date());
  if (!c) return `<div class="page"><div class="head"><h1>Kalender</h1></div>
    <div class="plan-card"><div class="pc-d">Trainingsplan</div><h3>Fingerboard-Challenge</h3>
    <div class="note" style="color:#c9c8e8">${PLAN.length} Wochen mit je 3 Trainingstagen (Tag 2, 4 und 7 der Woche). Doppel-Einheiten werden automatisch zu einem Training ohne Pause verbunden.</div>
    <div class="field" style="border-color:rgba(255,255,255,.15);margin-top:8px"><label>Tag 1 der Challenge</label><input type="date" class="sel" id="cstart" value="${today}"></div>
    <button class="btn" data-a="chstart">Challenge starten</button></div>
    <div class="sec"><h2>Plan</h2>${PLAN.map((wk, wi) => `<div class="field"><label>Woche ${wi + 1}</label><span>${wk.map(lv => lv.map(k => LV[k]).join(' + ')).join(' · ')}</span></div>`).join('')}</div></div>`;
  if (!V.calSel) { const nx = c.sessions.find(x => x.date >= today && !planDone(x.date)); V.calSel = nx ? nx.date : today; }
  if (!V.calMonth) V.calMonth = V.calSel.slice(0, 7);
  const [y, m] = V.calMonth.split('-').map(Number), first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7, days = new Date(y, m, 0).getDate();
  let cells = '';
  for (let i = 0; i < Math.ceil((lead + days) / 7) * 7; i++) {
    const d = addDays(first, i - lead), k = ymd(d), p = planOn(k), done = p && planDone(k), fr = freeOn(k);
    const cls = ['cd', d.getMonth() !== m - 1 ? 'out' : '', p ? 'plan' : '', k === today ? 'today' : '', k === V.calSel ? 'sel' : '', done ? 'done' : '', p && !done && k < today ? 'miss' : ''].join(' ');
    const dots = [...(p ? p.lv : []), ...fr.map(freeLv)];
    cells += `<div class="${cls}${fr.length && !p ? ' plan' : ''}" ${p || fr.length ? `data-a="calsel" data-d="${k}"` : ''}><span class="num">${d.getDate()}</span>${dots.length ? `<span class="cdots">${dots.map(x => `<i class="lv-${x}"></i>`).join('')}</span>` : ''}${done ? '<span class="ok">✓</span>' : fr.length ? '<span class="ok free">✓</span>' : ''}</div>`;
  }
  const sel = planOn(V.calSel), selFree = freeOn(V.calSel), doneN = c.sessions.filter(x => planDone(x.date)).length;
  const wk = Math.min(PLAN.length, Math.max(1, Math.floor((pday(today) - pday(c.start)) / 864e5 / 7) + 1));
  const selCard = sel ? `<div class="plan-card"><div class="pc-d">${fmtDay(sel.date)} · Woche ${sel.week}</div><h3>${planLabel(sel)}${planDone(sel.date) ? ' ✓' : ''}</h3>
    <div class="pc-list">${sel.lv.map(k => `<span class="lv-${k}">${LV[k]} Workout</span>`).join('')}</div>
    <div class="note" style="color:#c9c8e8;margin-bottom:10px">${planMin(sel)} Min${sel.lv.length > 1 ? ' am Stück, ohne Pause dazwischen' : ''}</div>
    <button class="btn" data-a="planstart" data-d="${sel.date}">${planDone(sel.date) ? 'Nochmal trainieren' : 'Training starten'}</button></div>`
    : selFree.length ? '' : `<div class="note" style="text-align:center;margin-top:16px">${fmtDay(V.calSel)}: kein Training geplant.</div>`;
  const freeCard = selFree.length ? `<div class="hist" style="cursor:default"><div class="t"><b>Freies Training</b><span>${sel ? '' : fmtDay(V.calSel)}</span></div>
    ${selFree.map(h => `<small><i class="lv-${freeLv(h)}" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px"></i>${esc(h.name)} · Hangtime ${human(h.hang)}${h.partial ? ' · abgebrochen' : ''}</small>`).join('<br>')}</div>` : '';
  return `<div class="page"><div class="head"><h1>Kalender</h1></div>
  <div class="sec" style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:15px"><span>Woche ${wk} von ${PLAN.length}</span><span>${doneN} / ${c.sessions.length} Einheiten</span></div><div class="prog"><i style="width:${doneN / c.sessions.length * 100}%"></i></div></div>
  <div class="cal-h"><button data-a="calmon" data-d="-1" aria-label="Voriger Monat">‹</button><b>${first.toLocaleDateString('de-DE', {month:'long', year:'numeric'})}</b><button data-a="calmon" data-d="1" aria-label="Nächster Monat">›</button></div>
  <div class="cal">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(x => `<div class="wd">${x}</div>`).join('')}${cells}</div>
  <div class="cal-leg"><span><i class="lv-E"></i>Easy</span><span><i class="lv-M"></i>Medium</span><span><i class="lv-H"></i>Hard</span><span>✓ Plan erledigt</span><span style="color:#9c9ca8">✓ freies Training</span></div>
  ${selCard}${freeCard}
  <div class="sec"><h2>Erinnerung</h2><button class="btn ghost" data-a="chics">🔔 Termine in Handy-Kalender (18 Uhr)</button>
  <div class="note">Lädt eine Kalenderdatei mit allen ${c.sessions.length} Trainingstagen um 18:00 inkl. Mitteilung. Auf dem iPhone öffnen und „Alle hinzufügen“ wählen.</div></div>
  <div class="sec"><button class="btn danger" data-a="chstop">Challenge beenden</button></div></div>`;
}

const afterTarget = t => { if (t === 'quick') saveS(); };
const A = {

document.addEventListener('click', ev => {
  const hold = ev.target.closest('[data-hold]'), pk = ev.target.closest('[data-pick]');
  if (hold && pk) {
    const o = target(pk.dataset.pick), k = hold.dataset.hold;
    if (o[V.hand] === k) o[V.hand] = null; else { o[V.hand] = k; if (V.hand === 'L') V.hand = 'R'; }
    afterTarget(pk.dataset.pick); render(); return;
  }
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  const fn = A[el.dataset.a] || PA[el.dataset.a];
  if (fn) fn(el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target, d = el.dataset;
  if (d.w) V.edit[d.w] = el.value;
  else if (d.str) target(d.t)[d.str] = el.value;
  else if (d.s) { S[d.s] = el.value; saveS(); }
  else if (d.range != null) { P.dlgVal = +el.value; document.getElementById('dlgv').textContent = el.value; }
});
document.addEventListener('change', ev => {
  const el = ev.target, d = el.dataset;
  if (d.w) { V.edit[d.w] = el.value; render(); }
  else if (d.task != null) {
    const t = V.edit.ex[V.exi].tasks[+d.task];
    if (d.tk === 'pair') [t.L, t.R] = el.value.split('|');
    else if (d.tk === 'n') t.n = Math.max(1, Math.round(+el.value || 0));
    else { t.kind = el.value; if (!t.n) t.n = el.value === 'pull' ? 2 : 10; }
    render();
  }
  else if (d.sel) { target(d.t)[d.sel] = el.value; afterTarget(d.t); render(); }
  else if (d.num) { const o = target(d.t); o[d.num] = Math.max(MIN[d.num] ?? 0, Math.round(+el.value || 0)); afterTarget(d.t); render(); }
  else if (d.snum) { S[d.snum] = Math.max(0, +el.value || 0); saveS(); render(); }
  else if (el.id === 'impf' && el.files[0]) {
    el.files[0].text().then(t => { const j = JSON.parse(t); if (!confirm('Aktuelle Daten durch das Backup ersetzen?')) return;
      if (j.workouts) { W = j.workouts; saveW(); } if (j.history) { HIST = j.history; saveH(); } if (j.settings) { S = Object.assign(S, j.settings); saveS(); } render(); })
      .catch(() => alert('Die Datei konnte nicht gelesen werden.'));
  }
});

// ---------- Ton, Sprache, Display an ----------
let AC;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function beep(f = 880, d = .12, v = .3) {
  if (!S.sound) return; const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(v, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d + .05);
}
function say(t) {
  if (!S.sound || !S.voice || !window.speechSynthesis) return;
  // "Hang" würde deutsch falsch ausgesprochen, deshalb wird "Hängen" angesagt
  t = t.replace(/\bHang\b/g, 'Hängen');
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'de-DE'; u.rate = 1.05; speechSynthesis.speak(u); } catch {}
}
let WL = null;
async function wakeLock(on) {
  try { if (on) { if (navigator.wakeLock && !WL) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => WL = null); } } else if (WL) { await WL.release(); WL = null; } } catch {}
}
document.addEventListener('visibilitychange', () => { if (P && document.visibilityState === 'visible') wakeLock(true); });

// ---------- Player ----------
let P = null;
const proot = document.getElementById('player');

function buildSteps(w) {
  const steps = []; let g = 0;
  w.ex.forEach((e, ei) => {
    if (e.type === 'minute') {
      // Minuten laufen ohne Pause direkt nacheinander; nur vor dem ersten Block bereit machen + Countdown
      if (!ei || w.ex[ei - 1].type !== 'minute') steps.push({k:'ready', ei, g:g + 1}, {k:'count', ei, s:1, g:g + 1});
      g++; steps.push({k:'work', ei, s:1, g, dur:e.dur});
      return;
    }
    if (e.askWeight) steps.push({k:'weight', ei, g:g + 1});
    steps.push({k:'ready', ei, g:g + 1});
    for (let s = 1; s <= e.sets; s++) {
      g++;
      steps.push({k:'count', ei, s, g});
      if (e.type === 'pullup') steps.push({k:'work', ei, s, g, dur:e.timeLimit});
      else for (let r = 1; r <= e.reps; r++) {
        steps.push({k:'work', ei, s, g, r, dur:e.hang});
        if (r < e.reps && e.repRest > 0) steps.push({k:'repRest', ei, s, g, r, dur:e.repRest});
      }
      if (s < e.sets) steps.push({k:'rest', ei, s, g, dur:e.setRest, next:ei});
      else if (ei < w.ex.length - 1 && e.restAfter > 0) steps.push({k:'rest', ei, s, g, dur:e.restAfter, next:ei + 1});
    }
  });
  steps.push({k:'done', g});
  return {steps, total:g};
}
function startWorkout(w, plan) {
  audio();
  const {steps, total} = buildSteps(w);
  P = {w, steps, total, minTotal:w.ex.reduce((a, e) => a + (e.type === 'minute' ? e.dur : 0), 0), i:0, remain:0, endAt:0, paused:false, iv:null, dlg:null, dlgVal:0, last:0, start:Date.now(),
       weights:w.ex.map(e => S.lastW[e.id] ?? 0),
       sess:{id:uid(), date:Date.now(), wid:w.id, name:w.name, level:w.level || null, plan:plan || null, hang:0, dur:0,
             ex:w.ex.map(e => ({name:exTitle(e), sets:Array.from({length:e.sets}, () => ({w:0, target:e.reps, done:0, sec:0}))}))}};
  wakeLock(true);
  enter(0);
}
const cur = () => P.steps[P.i];
function enter(i) {
  clearInterval(P.iv); P.iv = null;
  P.i = Math.max(0, Math.min(i, P.steps.length - 1));
  const st = cur(), e = P.w.ex[st.ei];
  P.remain = st.k === 'count' ? S.countdown : (st.dur || 0);
  P.lastWhole = Math.ceil(P.remain);
  if (st.k === 'count' && P.remain <= 0) return enter(P.i + 1);
  if (st.k === 'work') { beep(1320, .45); if (e.type === 'minute') say(e.name + '. ' + e.tasks.map(taskSay).join('. Dann ')); else if (st.r === 1 || !st.r) say('Los'); }
  if (st.k === 'repRest') beep(520, .3);
  if (st.k === 'rest') { beep(520, .5); say(st.next !== st.ei ? 'Pause. Nächste Übung: ' + exTitle(P.w.ex[st.next]) : 'Pause'); }
  if (st.k === 'ready') say('Mach dich bereit für ' + exTitle(e));
  if (st.k === 'done') finish(false);
  if (st.k === 'count' || st.dur) run();
  renderPlayer();
}
function run() {
  if (P.paused) return;
  P.endAt = performance.now() + P.remain * 1000; P.last = performance.now();
  clearInterval(P.iv); P.iv = setInterval(tick, 100);
}
function tick() {
  const st = cur(), now = performance.now();
  P.remain = (P.endAt - now) / 1000;
  const isMin = P.w.ex[st.ei] && P.w.ex[st.ei].type === 'minute';
  if (st.k === 'work' && !isMin) { const dt = Math.min(now - P.last, 1000) / 1000; P.sess.hang += dt; P.sess.ex[st.ei].sets[st.s - 1].sec += dt; }
  P.last = now;
  const whole = Math.ceil(P.remain);
  if (whole !== P.lastWhole) { P.lastWhole = whole; if (whole > 0 && whole <= 3 && (st.k !== 'work' || isMin)) beep(880, .1); }
  if (P.remain <= 0) { leaveWork(false); return enter(P.i + 1); }
  updateLive();
}
// beim Verlassen eines Arbeitsschritts Ergebnis festhalten
function leaveWork(early) {
  const st = cur(); if (st.k !== 'work') return;
  const e = P.w.ex[st.ei], rec = P.sess.ex[st.ei].sets[st.s - 1];
  rec.w = P.weights[st.ei];
  if (e.type === 'minute') {
    if (!early) { const hs = e.tasks.reduce((a, t) => a + (t.kind === 'hang' ? t.n : 0), 0); rec.done = 1; rec.sec = hs; P.sess.hang += hs; }
    return;
  }
  if (e.type === 'pullup') { P.dlg = {ei:st.ei, s:st.s}; P.dlgVal = e.reps; }
  else { if (!early) rec.done++; if (!early) beep(440, .5); }
}
function updateLive() {
  const st = cur();
  const f = document.getElementById('pfill'), t = document.getElementById('ptime'), b = document.getElementById('pbig'), h = document.getElementById('pht');
  const dur = st.k === 'count' ? S.countdown : st.dur;
  if (f && dur) f.style.width = Math.min(100, (1 - P.remain / dur) * 100) + '%';
  if (t) t.textContent = mmss(P.remain);
  if (b) b.textContent = Math.max(1, Math.ceil(P.remain));
  if (h) h.textContent = Math.round(P.sess.hang) + 's';
  const tot = document.getElementById('ptot');
  if (tot) tot.textContent = mmss(Math.floor(P.minBase + st.dur - P.remain));
}
const PI = {
  x:'<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2"><path d="M3 3l18 18M21 3L3 21"/></svg>',
  snd:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M6 17h9l12-9v32l-12-9H6z"/><path d="M33 17c3 4 3 10 0 14M38 13c5 6 5 16 0 22" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
  mute:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M6 17h9l12-9v32l-12-9H6z"/><path d="M33 19l10 10M43 19L33 29" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>',
  prev:'<svg viewBox="0 0 48 48" fill="#fff"><rect x="6" y="6" width="5" height="36"/><path d="M42 6v36L13 24z"/></svg>',
  next:'<svg viewBox="0 0 48 48" fill="#fff"><rect x="37" y="6" width="5" height="36"/><path d="M6 6v36l29-18z"/></svg>',
  pause:'<svg viewBox="0 0 48 48" fill="#fff"><rect x="10" y="6" width="5" height="36"/><rect x="33" y="6" width="5" height="36"/></svg>',
  play:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M10 5v38l32-19z"/></svg>',
  minus:'<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2.4"><path d="M2 12h20"/></svg>',
  plus:'<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2.4"><path d="M2 12h20M12 2v20"/></svg>'
};
function renderPlayer() {
  if (!P) { proot.innerHTML = ''; return; }
  const st = cur(), e = P.w.ex[st.ei];
  const phase = st.k === 'work' ? 'work' : (st.k === 'rest' || st.k === 'repRest') ? 'rest' : '';
  const ctrl = (show) => show ? `<div class="p-ctrl"><button data-a="p-snd" aria-label="Ton">${S.sound ? PI.snd : PI.mute}</button><button data-a="p-prev" aria-label="Zurück" ${P.i === 0 ? 'disabled' : ''}>${PI.prev}</button><button data-a="p-pause" aria-label="Pause">${st.k === 'ready' || P.paused ? PI.play : PI.pause}</button><button data-a="p-next" aria-label="Weiter">${PI.next}</button></div>` : '<div></div>';
  const ht = `<div class="ht"><b id="pht">${Math.round(P.sess.hang)}s</b><span>Hangtime</span></div>`;
  const gset = st.k === 'rest' ? st.g + 1 : st.g;
  P.minBase = P.steps.slice(0, P.i).reduce((a, s) => a + (s.k === 'work' && P.w.ex[s.ei].type === 'minute' ? s.dur : 0), 0);
  const minuteMid = x => `<div class="p-board mb">${boardSVG(null, null, false, taskMarks(x))}</div><div class="tasks">${x.tasks.map((t, i) => `<div class="task"><i style="background:${TCOL[i % 3]}"></i>${esc(taskText(t))}</div>`).join('')}</div>`;
  const setTxt = st.k === 'done' ? '' : `${e && e.type === 'minute' ? 'Minute' : 'Satz'} ${gset} <span>/ ${P.total}</span>`;
  const grip = (hold, left) => `<div class="grip">${handSVG(e.fingers, e.grip, left)}<div class="gn">${hold ? FINGERS[e.fingers] : 'frei'}</div><div>${hold ? esc(GRIPS[e.grip]) : 'Hand nicht am Board'}</div></div>`;
  let title = '', sub = '', subG = false, mid = '', btn = '', right = ht, controls = true;
  switch (st.k) {
    case 'weight': {
      const kg = P.weights[st.ei], pct = Math.round(kg / (+S.bw || 70) * 100);
      title = 'Zusätzliches Gewicht hinzufügen?'; sub = 'Für: ' + esc(exTitle(e)); controls = false;
      mid = `<div class="wt"><div>${kg < 0 ? 'Ich entlaste mit' : 'Ich füge hinzu'}</div><div class="row"><button data-a="p-kg" data-d="-1" aria-label="Weniger">${PI.minus}</button><div class="val"><b>${Math.abs(kg)}</b> <small>kg</small></div><button data-a="p-kg" data-d="1" aria-label="Mehr">${PI.plus}</button></div><div>${Math.abs(pct)} % vom Körpergewicht</div></div>`;
      btn = `<button class="p-btn" data-a="p-go">Weiter</button>`; break;
    }
    case 'ready':
      if (e.type === 'minute') {
        title = 'Mach dich bereit für ' + esc(exTitle(e)); sub = `${esc(P.w.name)} · ${Math.round(P.minTotal / 60)} Minuten ohne Pause`; subG = true;
        mid = minuteMid(e); btn = `<button class="p-btn" data-a="p-go">Starten</button>`; break;
      }
      title = 'Mach dich bereit für ' + esc(exTitle(e)); sub = 'Brauche Beastmaker 1000 · ' + esc(holdsText(e)); subG = true;
      mid = `${grip(e.L, true)}<div class="p-board">${boardSVG(e.L, e.R)}</div>${grip(e.R, false)}`;
      btn = `<button class="p-btn" data-a="p-go">Starten</button>`; break;
    case 'count':
      controls = false; mid = `<div class="big" id="pbig">${Math.ceil(P.remain)}</div>`; break;
    case 'work':
      if (e.type === 'minute') {
        const n = P.w.ex[st.ei + 1];
        title = esc(e.name); mid = minuteMid(e);
        btn = `<div class="p-next">${n && n.type === 'minute' ? 'Danach: ' + esc(n.tasks.map(taskText).join(' → ')) : 'Letzte Übung!'}</div>`;
        right = `<div class="p-time" id="ptime">${mmss(P.remain)}</div><div class="tot">Gesamt <span id="ptot"></span> / ${mmss(P.minTotal)}</div>`; break;
      }
      title = esc(exTitle(e)); sub = e.type === 'hang' ? `Wdh. ${st.r} / ${e.reps}${P.weights[st.ei] ? ` · ${P.weights[st.ei] > 0 ? '+' : ''}${P.weights[st.ei]} kg` : ''}` : (P.weights[st.ei] ? `${P.weights[st.ei] > 0 ? '+' : ''}${P.weights[st.ei]} kg` : '');
      mid = `<div class="p-board">${boardSVG(e.L, e.R)}</div>`;
      btn = `<button class="p-btn" data-a="p-kaputt">Geschafft!</button>`;
      right = `<div class="p-time" id="ptime">${mmss(P.remain)}</div>`; break;
    case 'repRest':
      title = 'Kurz loslassen'; sub = `Gleich Wdh. ${st.r + 1} / ${e.reps}`;
      mid = `<div class="rt"><div class="p-time" id="ptime">${mmss(P.remain)}</div><div class="lb">Pause</div></div>`;
      btn = `<button class="p-btn" data-a="p-next">Weiter</button>`; break;
    case 'rest': {
      const n = P.w.ex[st.next];
      title = `Du hast Satz ${st.g} geschafft`; sub = (st.next !== st.ei ? 'Nächste Übung: ' : 'Nächster Satz: ') + esc(exTitle(n));
      mid = `<div class="rt"><div class="p-time" id="ptime">${mmss(P.remain)}</div><div class="lb">Pause</div><button class="plus" data-a="p-more">+15 s</button></div>`;
      btn = `<button class="p-btn" data-a="p-next">Pause überspringen</button>`; break;
    }
    case 'done': {
      const sets = P.sess.ex.reduce((a, x) => a + x.sets.filter(s => s.sec > 0 || s.done).length, 0);
      title = 'Training geschafft!'; sub = esc(P.w.name); controls = false;
      mid = `<div class="done-s"><div><b>${Math.round(P.sess.hang)} s</b><span>Hangtime</span></div><div><b>${sets}</b><span>Sätze</span></div><div><b>${mmss(P.sess.dur)}</b><span>Dauer</span></div></div>`;
      btn = `<button class="p-btn" data-a="p-end">Fertig</button>`; right = ''; break;
    }
  }
  const dlg = P.dlg ? `<div class="dlg-bg"><div class="dlg"><h3>Wie viele Wiederholungen hast du vollendet?</h3><p>Wähle aus, wie viele Wiederholungen du gemacht hast, und drücke Abschicken.</p>
    <div class="v" id="dlgv">${P.dlgVal}</div><input type="range" min="0" max="${P.w.ex[P.dlg.ei].reps + 4}" value="${P.dlgVal}" data-range><button class="ok" data-a="p-reps">Abschicken</button></div></div>` : '';
  proot.innerHTML = `<div class="player ${phase}"><div class="fill" id="pfill"></div><div class="p-in">
    <div class="p-top"><button class="p-x" data-a="p-close" aria-label="Schließen">${PI.x}</button><div class="p-title">${title}</div>${ctrl(controls)}</div>
    ${sub ? `<div class="p-sub${subG ? ' g' : ''}">${sub}</div>` : ''}
    <div class="p-mid">${mid}</div>
    <div class="p-bot"><div class="p-set">${setTxt}</div><div>${btn}</div><div class="p-right">${right}</div></div>
    ${st.k === 'ready' ? '<div class="rot">Tipp: Handy quer halten</div>' : ''}
  </div>${dlg}</div>`;
  updateLive();
}
function finish(partial) {
  if (!P || P.saved) return;
  P.sess.dur = (Date.now() - P.start) / 1000; P.sess.partial = partial;
  P.w.ex.forEach((e, i) => { if (e.askWeight) S.lastW[e.id] = P.weights[i]; }); saveS();
  if (P.sess.ex.some(x => x.sets.some(s => s.sec > 0 || s.done))) { HIST.unshift(P.sess); saveH(); }
  P.saved = true;
  if (!partial) say('Training geschafft. Stark!');
}
function closePlayer() { clearInterval(P.iv); P = null; wakeLock(false); proot.innerHTML = ''; render(); }
const PA = {
  'p-close': () => {
    if (cur().k === 'done') return closePlayer();
    P.paused = true; clearInterval(P.iv); P.iv = null; renderPlayer();
    if (confirm('Training beenden? Der bisherige Fortschritt wird im Verlauf gespeichert.')) { leaveWork(true); P.dlg = null; finish(true); closePlayer(); }
    else { P.paused = false; if (P.iv === null && (cur().dur || cur().k === 'count')) run(); renderPlayer(); }
  },
  'p-snd': () => { S.sound = !S.sound; saveS(); renderPlayer(); },
  'p-go': () => { audio(); enter(P.i + 1); },
  'p-pause': () => {
    const st = cur(); audio();
    if (st.k === 'ready' || st.k === 'weight') return enter(P.i + 1);
    if (!st.dur && st.k !== 'count') return;
    P.paused = !P.paused;
    if (P.paused) { clearInterval(P.iv); P.iv = null; } else run();
    renderPlayer();
  },
  'p-next': () => { audio(); leaveWork(true); P.paused = false; enter(P.i + 1); },
  'p-prev': () => { let j = P.i - 1; while (j > 0 && P.steps[j].k === 'count') j--; P.paused = false; P.dlg = null; enter(j); },
  'p-kaputt': () => {
    const st = cur(); leaveWork(st.k === 'work' && P.w.ex[st.ei].type === 'hang');
    // restliche Wiederholungen dieses Satzes überspringen
    let j = P.i + 1; while (P.steps[j] && P.steps[j].ei === st.ei && P.steps[j].s === st.s && (P.steps[j].k === 'work' || P.steps[j].k === 'repRest')) j++;
    P.paused = false; enter(j);
  },
  'p-kg': el => { P.weights[cur().ei] += +el.dataset.d; renderPlayer(); },
  'p-more': () => { P.remain += 15; P.endAt += 15000; P.steps[P.i].dur += 15; updateLive(); },
  'p-reps': () => { P.sess.ex[P.dlg.ei].sets[P.dlg.s - 1].done = P.dlgVal; P.dlg = null; if (P.saved) saveH(); renderPlayer(); },
  'p-end': () => closePlayer()
};

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
